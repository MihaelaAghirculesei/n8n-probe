global:
  scrape_interval: 10s

scrape_configs:
  - job_name: n8n-probe
    static_configs:
      # `n8n` resolves via compose's internal DNS to the n8n container itself,
      # where HttpExample.node.ts's demo-only initMetrics() serves
      # :9464/metrics (docker-compose.yml's N8N_PROBE_DEMO_OBSERVABILITY).
      - targets: ['n8n:9464']
