# Local observability stack for manually exercising @n8n-probe/otel and
# @n8n-probe/metrics against a real n8n instance.
#
#   docker compose -f docker/docker-compose.yml up -d
#
# n8n        -> http://localhost:5678
# Prometheus -> http://localhost:9090
# Grafana    -> http://localhost:3000  (admin / admin)
# Jaeger UI  -> http://localhost:16686

services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - '5678:5678'
      - '9464:9464' # @n8n-probe/metrics Prometheus exposition endpoint
    environment:
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      # Turns on HttpExample.node.ts's module-load-time initTracing/initMetrics
      # call (see the comment above that block). Only ever set here — a real
      # install of this example, and every test suite / apps/dogfood, does its
      # own host-side init instead.
      - N8N_PROBE_DEMO_OBSERVABILITY=1
      - N8N_PROBE_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    volumes:
      # Only dist/ is mounted, no node_modules alongside it. dist/ is a tsup
      # bundle (apps/example-node/tsup.config.ts) that inlines @n8n-probe/otel,
      # @n8n-probe/metrics, and their @opentelemetry/* deps, so HttpExample's
      # require() of them resolves here for real — see ADR-0010/ADR-0011 in
      # docs/ARCHITECTURE.md.
      - ../apps/example-node/dist:/home/node/.n8n/custom/n8n-nodes-probe-example:ro
      - n8n_data:/home/node/.n8n

  prometheus:
    image: prom/prometheus:latest
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - '3000:3000'
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - '16686:16686' # UI
      - '4318:4318' # OTLP HTTP

volumes:
  n8n_data:
