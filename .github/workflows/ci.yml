name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly, drives the full-instance E2E tier

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build / node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e-full:
    name: e2e (full instance)
    if: >-
      github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'e2e-full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:full
# There is deliberately no release job here until Milestone 9 (see docs/PLAN.md).
# Releasing needs the npm @n8n-probe scope, an OIDC Trusted Publisher, provenance,
# and the repo setting "Allow GitHub Actions to create and approve pull requests"
# (Settings -> Actions -> General -> Workflow permissions) so Changesets can open
# its "Version Packages" PR. Until all of that exists, running `changesets/action`
# on every push to main only produces red runs, so it lives in its own
# `.github/workflows/release.yml` added in M9 rather than in this validation
# workflow. Changesets accumulate in `.changeset/` in the meantime; run
# `pnpm version-packages` locally whenever a version bump is actually wanted.
