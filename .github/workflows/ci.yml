name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly, drives the full-instance E2E tier

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; a job that needs more raises its own `permissions`.
permissions:
  contents: read

# CI rules (also in AGENTS.md, enforced by the `guards` job):
#   1. Every job here runs on pull_request, so every check can be a required
#      check. No job may be gated to run only on a push to the default branch:
#      it would run after merge, could not gate the PR, and has turned main red
#      before. Release-type automation lives in its own workflow (Milestone 9).
#   2. .github/rulesets/main.json requires exactly one check: `ci`. Everything
#      that must gate a merge is wired into `ci` via `needs:` below, so adding
#      or renaming jobs never silently un-protects the main branch.

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: actionlint (pinned + checksum-verified)
        run: |
          set -euo pipefail
          version=1.7.12
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${sha}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: workflow invariants
        run: bash scripts/check-workflow-invariants.sh

  build:
    name: build / node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  consumer:
    name: consumer smoke
    # Packs every package and installs the tarballs into a project outside the
    # workspace, then runs a consumer suite (scripts/consumer-smoke.mjs). Gates
    # merges: a broken `exports` map or a dependency that only resolves inside
    # the monorepo ships to every user otherwise (ADR-0014).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/consumer-smoke.mjs

  e2e-full:
    name: e2e (full instance)
    # Opt-in only (nightly schedule or the `e2e-full` PR label). Deliberately
    # NOT wired into `ci` — a flaky Docker-backed nightly must never block a PR
    # or redden a main commit; a failed run here is its own signal.
    if: >-
      github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'e2e-full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:full

  n8n-compat:
    name: n8n compatibility (latest)
    # The lockfile pins the n8n packages the toolkit is built against, so the
    # `build` job can never notice a new n8n release breaking the internals we
    # use (`WorkflowExecute`, `ExecutionLifecycleHooks`, `IExecuteFunctions`).
    # This re-resolves them to `latest` — including across a major, which is
    # the point — and runs the fast suite. Opt-in like `e2e-full` (nightly or
    # the `n8n-compat` PR label) and outside the `ci` gate: an upstream release
    # must not block unrelated PRs; a red run here is the signal to act on.
    if: >-
      github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'n8n-compat')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: resolve n8n packages to latest
        run: pnpm update --recursive --latest n8n-workflow n8n-core
      - name: report resolved versions
        run: pnpm list --recursive --depth 0 n8n-workflow n8n-core
      - run: pnpm typecheck
      - run: pnpm test

  # The single required status check. If any gating job fails or is skipped for
  # the wrong reason this fails, and the branch ruleset blocks the merge.
  ci:
    name: ci
    needs: [guards, build, consumer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: require guards + build + consumer to have succeeded
        run: |
          set -euo pipefail
          echo "guards   = ${{ needs.guards.result }}"
          echo "build    = ${{ needs.build.result }}"
          echo "consumer = ${{ needs.consumer.result }}"
          [ "${{ needs.guards.result }}" = "success" ] || { echo "::error::guards did not succeed"; exit 1; }
          [ "${{ needs.build.result }}" = "success" ] || { echo "::error::build did not succeed"; exit 1; }
          [ "${{ needs.consumer.result }}" = "success" ] || { echo "::error::consumer did not succeed"; exit 1; }
